<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Primera versión del dashboard del Tacómetro Digital PIC II." />
    <title>PIC II · Tacómetro básico</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page-shell">
      <header>
        <p class="eyebrow">PIC II · TACÓMETRO DIGITAL</p>
        <h1>Monitoreo de RPM</h1>
        <p>Primera versión del panel de pruebas.</p>
      </header>

      <section class="card" aria-labelledby="motorTitle">
        <div class="card-heading">
          <div>
            <p class="eyebrow">SENSOR SIMULADO</p>
            <h2 id="motorTitle">Motor principal</h2>
          </div>
          <span class="status" id="status">En espera</span>
        </div>

        <div class="reading">
          <strong id="rpmValue">0</strong>
          <span>RPM</span>
        </div>

        <div class="meter" aria-hidden="true"><span id="meterFill"></span></div>
        <p id="rangeText">Motor detenido</p>

        <button id="toggleDemo" type="button">Iniciar simulación</button>
      </section>
    </main>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
